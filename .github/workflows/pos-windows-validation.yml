name: POS Windows validation

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/pos/**"
      - ".github/workflows/pos-windows-validation.yml"
  push:
    branches: [main, "feat/**", "rollback/**"]
    paths:
      - "apps/pos/**"
      - ".github/workflows/pos-windows-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/pos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/pos/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check and build frontend
        run: npm run build

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/pos/src-tauri -> target

      - name: Run Rust database transaction tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Windows installer
        run: npm run tauri -- build --bundles nsis

      - name: Smoke-test the built Windows application
        shell: pwsh
        run: |
          $app = Join-Path $PWD "src-tauri/target/release/pos-starter.exe"
          if (!(Test-Path $app)) {
            Write-Error "Built application executable was not found at $app"
            exit 1
          }
          $stdout = Join-Path $env:TEMP "skc-pos-startup-stdout.log"
          $stderr = Join-Path $env:TEMP "skc-pos-startup-stderr.log"
          $process = Start-Process -FilePath $app -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          Start-Sleep -Seconds 8
          $process.Refresh()
          if ($process.HasExited) {
            Write-Host "POS application exited during startup with code $($process.ExitCode)."
            if (Test-Path $stdout) { Get-Content $stdout }
            if (Test-Path $stderr) { Get-Content $stderr }
            exit 1
          }
          Stop-Process -Id $process.Id -Force
          Write-Host "POS application remained running for the 8-second startup smoke test."

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: secret-kids-club-pos-windows-installer
          path: apps/pos/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
