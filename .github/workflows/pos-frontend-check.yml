name: POS Frontend Validation (No Windows Installer)
on:
  workflow_dispatch:
  push:
    branches:
      - "feat/**"
    paths:
      - "apps/pos/**"
      - ".github/workflows/pos-frontend-check.yml"
  pull_request:
    paths:
      - "apps/pos/**"
      - ".github/workflows/pos-frontend-check.yml"
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/pos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/pos/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: TypeScript and Vite build only
        run: npm run build
