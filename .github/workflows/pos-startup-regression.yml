name: POS startup regression check

on:
  push:
    branches: ["feat/visit-expiry-alerts-and-operations"]
    paths:
      - ".github/workflows/pos-startup-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: known-main-base
            ref: a0a601d17325d228ee852f2ffdf31564f0a61c9b
          - label: current-feature
            ref: c89d3d39f56d2beaff1db9ecc997298f9dca9ab1
    name: ${{ matrix.label }}
    defaults:
      run:
        working-directory: apps/pos
    steps:
      - name: Checkout exact source snapshot
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/pos/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Clean Rust build artifacts
        run: cargo clean --manifest-path src-tauri/Cargo.toml
      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build installer from clean source
        run: npm run tauri -- build --bundles nsis
      - name: Launch built executable and verify a window
        shell: pwsh
        run: |
          $app = Join-Path $PWD "src-tauri/target/release/pos-starter.exe"
          if (!(Test-Path $app)) { throw "Executable missing: $app" }
          $process = Start-Process -FilePath $app -PassThru
          Start-Sleep -Seconds 12
          $process.Refresh()
          if ($process.HasExited) { throw "Application exited during startup. Exit code: $($process.ExitCode)" }
          if ($process.MainWindowHandle -eq 0) {
            Get-CimInstance Win32_Process -Filter "ProcessId = $($process.Id)" | Format-List *
            Stop-Process -Id $process.Id -Force
            throw "Application stayed alive but did not expose a main window."
          }
          Stop-Process -Id $process.Id -Force
          Write-Host "Startup passed; main window handle was present."
      - name: Upload installer for the tested source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: pos-${{ matrix.label }}-${{ matrix.ref }}
          path: apps/pos/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
